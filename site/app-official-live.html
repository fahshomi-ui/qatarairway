    <script id="qa-internal-locale-boot">
      (function () {
        var lang = 'ar';
        try {
          var raw = window.localStorage.getItem('jzPref') || '{}';
          var pref = JSON.parse(raw) || {};
          var candidate = String(pref.siteLang || window.localStorage.getItem('jz_site_lang') || pref.lang || window.localStorage.getItem('jz_lang') || window.localStorage.getItem('lang') || '').replace(/"/g, '').trim().toLowerCase();
          if (candidate === 'ar' || candidate === 'en') {
            lang = candidate;
            pref.lang = lang;
            pref.siteLang = lang;
            window.localStorage.setItem('jzPref', JSON.stringify(pref));
            window.localStorage.setItem('jz_lang', lang);
            window.localStorage.setItem('lang', lang);
            window.localStorage.setItem('jzPrevLang', JSON.stringify(lang));
          }
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>

          try {
            var pref = JSON.parse(window.localStorage.getItem('jzPref') || '{}') || {};

            if (candidate === 'en' || candidate === 'ar') lang = candidate;
          } catch (e) {}
          return lang;
        };
        var translatePayment = function () {
          if (window.location.pathname !== '/credit-card-payment') return;
          var english = readLang() === 'en';
          var root = document.querySelector('.qr-pay-page');
          if (root) {
            root.setAttribute('dir', english ? 'ltr' : 'rtl');
            root.style.direction = english ? 'ltr' : 'rtl';
          }
          var map = english ? translations : reverse;
          if (!document.body) return;
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          var node;
          while ((node = walker.nextNode())) {
            var value = String(node.nodeValue || '').trim();
            var dynamicValue = english ? value : value
              .replace(/\b(Sun|Mon|Tue|Wed|Thu|Fri|Sat),?\s*/g, function (token) {
                var day = token.replace(',', '').trim();

              })
              .replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g, function (token) {
                return ({Jan:'يناير',Feb:'فبراير',Mar:'مارس',Apr:'أبريل',May:'مايو',Jun:'يونيو',Jul:'يوليو',Aug:'أغسطس',Sep:'سبتمبر',Oct:'أكتوبر',Nov:'نوفمبر',Dec:'ديسمبر'})[token];
              });
            if (dynamicValue !== value) node.nodeValue = node.nodeValue.replace(value, dynamicValue);
            else if (map[value]) node.nodeValue = node.nodeValue.replace(value, map[value]);
          }
          document.querySelectorAll('input[placeholder], textarea[placeholder]').forEach(function (field) {
            var value = field.getAttribute('placeholder');
            if (map[value]) field.setAttribute('placeholder', map[value]);
          });
          document.documentElement.lang = english ? 'en' : 'ar';
          document.documentElement.dir = english ? 'ltr' : 'rtl';
        };
        var observer = new MutationObserver(translatePayment);
        observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        window.addEventListener('storage', translatePayment);
        window.addEventListener('pageshow', translatePayment);
        document.addEventListener('DOMContentLoaded', translatePayment);
        translatePayment();
      })();

    <script>
      /* QA mobile results parity: keep the desktop results page untouched. */
      (function () {
        function mobileResultsCopy() {
          if (window.location.pathname !== '/flight-search' || window.innerWidth > 767) return;
          document.querySelectorAll('.qr-sheet').forEach(function (sheet) {
            sheet.classList.toggle('qa-edit-search-sheet', !!sheet.querySelector('.qr-trip-row'));
            sheet.classList.toggle('qa-calendar-sheet', !!sheet.querySelector('.qr-cal-grid'));
          });
          var heading = document.querySelector('.qr-h1');
          if (!heading) return;
          var titleContainer = document.querySelector('.qr-title-container');
          var todayLine = document.querySelector('.qr-today-line');
          if (titleContainer && todayLine && todayLine.parentNode !== titleContainer) titleContainer.insertBefore(todayLine, titleContainer.firstChild);
          var raw = '';
          try {
            var pref = JSON.parse(localStorage.getItem('jzPref') || '{}') || {};
            raw = String(pref.siteLang || pref.lang || localStorage.getItem('jz_site_lang') || localStorage.getItem('jz_lang') || '').toLowerCase();
          } catch (e) {}
          var english = raw === 'en' || document.documentElement.dir === 'ltr' || document.documentElement.lang === 'en-qa';
          var desired = english ? 'Select your departure date' : 'حدد موعد مغادرتك';
          if (heading.textContent.trim() !== desired) heading.textContent = desired;
          heading.setAttribute('data-qa-mobile-results-heading', '1');
          var note = document.querySelector('.qr-results-note');
          if (note && english && /[\u0600-\u06FF]/.test(note.textContent || '')) note.textContent = 'Fares displayed are for all passengers.';
          var weekly = document.querySelector('.qr-weekly');
          var activeDay = weekly && weekly.querySelector('.qr-weekly__day.active');
          if (weekly && activeDay && !weekly.dataset.qaMobileCentered) {
            weekly.dataset.qaMobileCentered = '1';
            requestAnimationFrame(function () {
              activeDay.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'auto' });
            });
          }
          document.querySelectorAll('.qr-card').forEach(function (card) {
            var bottom = card.querySelector('.qr-card__left > div:last-child');
            var fare = card.querySelector('.qr-cabin:not(.disabled) .qr-cabin__price');
            if (bottom && fare) {
              var mobilePrice = bottom.querySelector('.qa-mobile-card-price');
              if (!mobilePrice) {
                mobilePrice = document.createElement('span');
                mobilePrice.className = 'qa-mobile-card-price';
                bottom.insertBefore(mobilePrice, bottom.firstChild);
              }
              var currentFareText = fare.textContent.trim();
              if (mobilePrice.textContent.trim() !== currentFareText) mobilePrice.textContent = currentFareText;
            }
            var farePanel = card.querySelector('.qr-ff');
            if (farePanel && !farePanel.dataset.qaMobileReady) {
              farePanel.dataset.qaMobileReady = '1';
              var carrier = card.querySelector('.qr-op-logo');
              var code = carrier && String(carrier.getAttribute('alt') || '').trim().toUpperCase();
              if (code && code !== 'QR' && !card.querySelector('.qa-mobile-operator-banner')) {
                var carrierName = code === 'RJ' ? 'Royal Jordanian' : code;
                var operatorBanner = document.createElement('div');
                operatorBanner.className = 'qa-mobile-operator-banner';
                operatorBanner.textContent = english ? 'This journey includes flights operated by ' + carrierName + '.' : 'تتضمن هذه الرحلة رحلات طيران تتولى ' + carrierName + ' تشغيلها.';
                farePanel.parentNode.insertBefore(operatorBanner, farePanel);
              }
              setTimeout(function () {
                var cabins = card.querySelector('.qr-card__cabins');
                if (cabins) {
                  cabins.scrollIntoView({ block: 'start', behavior: 'auto' });
                  window.scrollBy(0, -92);
                }
              }, 0);
            }
            var summary = card.querySelector('.qr-card__left');
            if (summary && !summary.dataset.qaMobileToggle) {
              summary.dataset.qaMobileToggle = '1';
              summary.addEventListener('click', function (event) {
                if (window.innerWidth > 767 || event.target.closest('button,a')) return;
                card.classList.toggle('qa-mobile-expanded');
              });
            }
          });
        }
        window.addEventListener('resize', mobileResultsCopy, { passive: true });
        window.addEventListener('pageshow', mobileResultsCopy);
        document.addEventListener('DOMContentLoaded', mobileResultsCopy);
        new MutationObserver(mobileResultsCopy).observe(document.documentElement, { childList: true, characterData: true, subtree: true });
        mobileResultsCopy();
      })();
    </script>

    <script id="qa-package-payment-summary-bridge">
      (function () {
        if (window.location.pathname !== '/credit-card-payment' || new URLSearchParams(window.location.search).get('source') !== 'package') return;
        var context = null;
        try { context = JSON.parse(window.sessionStorage.getItem('qaPackagePaymentContext') || 'null'); } catch (e) {}
        var allowedSource = context && ['flight-hotel-package', 'stopover-package', 'hotel'].indexOf(context.source) >= 0;
        var fresh = allowedSource && Number.isFinite(Number(context.createdAt)) && Date.now() - Number(context.createdAt) >= 0 && Date.now() - Number(context.createdAt) < 1800000;
        var total = context && String(context.total || '').trim();
        var route = context && String(context.route || '').trim();
        var dates = context && String(context.dates || '').trim();
        var type = context && String(context.type || '').trim();
        if (!fresh || !/^[A-Z]{3}\s*[0-9][0-9,.]*$/.test(total) || !route || route.length > 180 || dates.length > 100 || type.length > 40) return;
        var english = context.lang === 'en';
        function text(node, value) { if (node && node.textContent !== value) node.textContent = value; }
        function apply() {
          var card = document.querySelector('.qr-pay-trip-card');
          if (!card) return;
          card.setAttribute('data-qa-package-payment', '1');
          text(card.querySelector('.qr-pay-trip-type'), type);
          text(card.querySelector('.qr-pay-trip-route'), route);
          text(card.querySelector('.qr-pay-trip-date'), dates);
          var rows = card.querySelectorAll('.qr-pay-trip-row');
          if (rows[0]) { var first = rows[0].querySelectorAll('span'); text(first[0], english ? 'Total package price' : 'إجمالي سعر الباقة'); text(first[first.length - 1], total); }
          if (rows[1]) { var second = rows[1].querySelectorAll('span'); text(second[0], english ? 'Total' : 'المجموع الكلي'); text(second[second.length - 1], total); }
        }
        var observer = new MutationObserver(apply);
        observer.observe(document.documentElement, {childList:true, subtree:true});
        document.addEventListener('DOMContentLoaded', apply);
        window.addEventListener('load', apply);
        apply();
        setTimeout(apply, 30000);
      })();
    </script>
